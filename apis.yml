aid: flaviar
name: Flaviar
description: >-
  Flaviar is an online spirits retailer and members club for whiskey, tequila,
  rum, gin and other premium spirits, offering curated tasting boxes, full-size
  bottles, and a subscription membership. Its direct-to-consumer storefront runs
  on Shopify and exposes a modern agent-commerce surface: a Universal Commerce
  Protocol (UCP) merchant profile and hosted MCP shopping endpoint, an llms.txt /
  agents.md agent-instruction document, and Shopify Customer Account
  authentication via OAuth 2.0 + OpenID Connect. This profile was added to the
  API Evangelist network as a portfolio lead and enriched from Flaviar's live
  public discovery documents.
